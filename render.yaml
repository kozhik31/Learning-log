services:
  - type: web
    name: learning-log
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn learning_log.wsgi"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: learning_log.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: learning-log-db
          property: connectionString

databases:
  - name: learning-log-db
